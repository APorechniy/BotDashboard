version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: tg_dashboard_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_dev
      MYSQL_DATABASE: tg_dashboard
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password_dev
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: